name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: runner.os != 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: npm ci
      - run: npm test
      - if: runner.os != 'Linux'
        run: cd tray && go vet ./... && go test ./...
      - if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - run: npm run build
      - run: npm run smoke
      # The installer is what winget runs, so test it for real: silent install, startup entry, both programs
      # running, silent uninstall, nothing left behind.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\mctwain-setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'no installer in dist' }
          # Not -Wait: that also waits for the helper the installer starts, which never exits.
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $p.WaitForExit(180000)) { throw 'installer did not finish in 3 minutes' }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'mctwain'
          foreach ($f in 'mctwain.exe','mctwain-tray.exe','start.vbs') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f after install" }
          }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').mctwain) { throw 'no startup entry' }
          Start-Sleep -Seconds 8
          $status = Invoke-RestMethod http://127.0.0.1:7788/status
          if ($status.name -ne 'mctwain') { throw 'helper does not answer on 7788' }
          Write-Host "helper answers: version $($status.version)"
          if (-not (Get-Process mctwain-tray -ErrorAction SilentlyContinue)) { throw 'tray is not running' }
          Write-Host 'tray is running'
          $uninstaller = Get-ChildItem (Join-Path $dir 'unins*.exe') | Select-Object -First 1
          $u = Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $u.WaitForExit(120000)) { throw 'uninstaller did not finish in 2 minutes' }
          # The uninstaller hands over to a temporary copy of itself and exits, so wait for the files to go.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path (Join-Path $dir 'mctwain.exe')) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          if (Get-Process mctwain, mctwain-tray -ErrorAction SilentlyContinue) { throw 'processes still running after uninstall' }
          if (Test-Path (Join-Path $dir 'mctwain.exe')) { throw 'files left after uninstall' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).mctwain) { throw 'startup entry left after uninstall' }
          Write-Host 'install, run and uninstall all work'
      - uses: actions/upload-artifact@v4
        with:
          name: mctwain-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Pushing a tag like v0.1.0 attaches every build to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
